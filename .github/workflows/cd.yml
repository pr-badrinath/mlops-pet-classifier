name: CD - Deploy & Smoke Test

# Triggers automatically when the CI workflow (M3) completes on a push to
# main/master - i.e. only after unit tests passed AND a new image was
# actually pushed to GHCR. Deliberately excludes CI runs triggered by pull
# requests, since M3's ci.yml only *builds* (doesn't push) on PRs, so there
# would be no new image tag to deploy yet.
#
# Also runnable manually via workflow_dispatch (deploys whatever "latest"
# currently points to) - handy for a first test run.
on:
  workflow_run:
    workflows: ["CI - Build, Test & Image Creation"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-and-smoke-test:
    name: Deploy (Docker Compose) & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Only proceed for a manual run, or a CI run that (a) succeeded and
    # (b) was itself triggered by a real push (not a pull_request build).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout repository at the exact commit CI just built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine which image tag to deploy
        id: image_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "tag=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the newly published image
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: docker compose pull

      - name: Deploy and wait for the container to report healthy
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: docker compose up -d --wait --wait-timeout 60

      - name: Set up Python for the smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependency
        run: pip install requests

      - name: Run post-deploy smoke test (health + both predict endpoints)
        # scripts/smoke_test.py exits non-zero on any failure, which fails
        # this step and therefore the whole job - satisfying "fail the
        # pipeline if smoke tests fail".
        run: python scripts/smoke_test.py --image tests/fixtures/sample_pet.jpg --url http://localhost:8000

      - name: Show container logs (only runs if a previous step failed)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
