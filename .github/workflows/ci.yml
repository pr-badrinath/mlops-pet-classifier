name: CI - Build, Test & Image Creation

# Runs on every push and every pull request targeting main/master, per the
# M3 requirement ("on every push/merge request, checks out the repository,
# installs dependencies, runs unit tests, and builds the Docker image").
# workflow_dispatch lets you trigger it manually from the Actions tab too,
# handy for a first test run before you've set up branch protection etc.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pet-classifier-api

jobs:
  # --- Job 1: install deps + run unit tests -------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install CPU-only torch
        # The default PyPI torch wheel bundles CUDA and is huge (~2GB),
        # which needlessly slows down CI on a GPU-less runner. The CPU-only
        # wheel is a fraction of the size and installs in a fraction of the
        # time; it's the exact same torch==2.2.2 version pinned in
        # requirements.txt, so pip will see it's already satisfied below.
        run: pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  # --- Job 2: build the Docker image and push it to GHCR ------------------
  # Only runs if the test job above succeeds (see `needs: test`), so a
  # broken build/test never gets published as an image.
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GitHub Container Registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, no setup needed

      - name: Compute lowercase image name
        # GHCR requires fully lowercase image paths; GitHub usernames/org
        # names can contain uppercase letters, so normalize defensively.
        id: image
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # build-only on PRs, push on real branches
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
